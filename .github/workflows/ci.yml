name: CI, Packaging & Releases

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Install Linux Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libegl1 libgl1-mesa-dev libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v tests/

  package:
    name: Package (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: kira-calculator-linux-x86_64
            build-args: --onefile
          - os: windows-latest
            artifact-name: kira-calculator-windows-x64
            build-args: --onefile
          - os: macos-latest
            artifact-name: kira-calculator-macos
            build-args: --onedir
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[packaging]"
      - name: Install Linux Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libegl1 libgl1-mesa-dev libxcb-cursor0
      - name: Build standalone executable
        run: python scripts/build_app.py ${{ matrix.build-args }}
      - name: Verify macOS archive
        if: runner.os == 'macOS'
        run: |
          unzip -l dist/kira-calculator-macos.zip
          unzip -l dist/kira-calculator-macos.zip | grep -q "kira-calculator.app/"
          unzip -l dist/kira-calculator-macos.zip | grep -q "kira-calculator.app/Contents/Info.plist"
          unzip -l dist/kira-calculator-macos.zip | grep -q "kira-calculator.app/Contents/MacOS/kira-calculator"
          unzip -l dist/kira-calculator-macos.zip | grep -q "README.md"
          unzip -l dist/kira-calculator-macos.zip | grep -q "LICENSE"
      - name: Upload Linux package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: kira-calculator-linux-x86_64
          path: |
            dist/kira-calculator
            dist/kira-calculator-*-linux-*.tar.gz
            dist/kira-calculator-*-linux-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: kira-calculator-windows-x64
          path: dist/kira-calculator-windows-x64.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload macOS package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: kira-calculator-macos
          path: dist/kira-calculator-macos.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate tag matches project version
        run: python scripts/build_app.py --check-tag ${{ github.ref_name }}

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kira-calculator-*
          path: release-assets
          merge-multiple: true

      - name: Verify required platform release archives exist
        run: |
          set -euo pipefail
          echo "Inspecting release assets in release-assets:"
          ls -la release-assets/

          count_linux=$(find release-assets -name "kira-calculator-*-linux-*.tar.gz" | wc -l)
          count_win=$(find release-assets -name "kira-calculator-windows-x64.zip" | wc -l)
          count_mac=$(find release-assets -name "kira-calculator-macos.zip" | wc -l)

          if [ "$count_linux" -eq 0 ]; then
            echo "ERROR: Missing Linux release tarball in release-assets!" >&2
            exit 1
          fi
          if [ "$count_win" -eq 0 ]; then
            echo "ERROR: Missing Windows release zip in release-assets!" >&2
            exit 1
          fi
          if [ "$count_mac" -eq 0 ]; then
            echo "ERROR: Missing macOS release zip in release-assets!" >&2
            exit 1
          fi
          echo "All required platform release archives confirmed present."
      - name: Generate SHA256 checksums
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          root = Path("release-assets")
          files = sorted(p for p in root.rglob("*") if p.is_file())
          lines = []
          for path in files:
              digest = sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path.relative_to(root).as_posix()}")
          (root / "SHA256SUMS.txt").write_text("\n".join(lines) + "\n")
          PY
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Kira Calculator ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/**/*
